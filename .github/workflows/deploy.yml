name: Deploy

on:
  workflow_dispatch: {}
  push:
    branches: ['master']
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: michaelmass/actions/dagger@master
        with:
          source: ci/deploy.ts
          infisical-access-token: ${{ secrets.INFISICAL_TOKEN }}
          infisical-project-id: ${{ secrets.INFISICAL_WORKSPACE_ID }}
          infisical-environment: production
